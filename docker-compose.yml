services:
  haizhu-canvas:
    build: .
    image: haizhu-infinity-canvas:1.0.0-rc.13
    ports:
      - "8787:8787"
    environment:
      # One person / a small team sharing one workspace: an access token (enter it in 设置 → 访问口令).
      # A website where everyone signs up for their own private workspace: set HZC_ACCOUNTS=1 instead,
      # plus HZC_ALLOWED_HOSTS (see docs/03-guide/saas-deployment.md).
      HZC_TOKEN: ${HZC_TOKEN:-}
      HZC_ACCOUNTS: ${HZC_ACCOUNTS:-0}
      # accounts mode: open | closed (closed: only `admin create-user` makes accounts)
      HZC_SIGNUP: ${HZC_SIGNUP:-open}
      # accounts mode: storage per user, in MB
      HZC_USER_QUOTA_MB: ${HZC_USER_QUOTA_MB:-2048}
      # accounts mode behind HTTPS: cookies only over HTTPS
      HZC_SECURE_COOKIES: ${HZC_SECURE_COOKIES:-0}
      # accounts mode: your own email(s) — admins get the console at /admin
      HZC_ADMIN_EMAILS: ${HZC_ADMIN_EMAILS:-}
      # accounts mode, optional: password-reset mail (smtps://user:pass@host:465) and the site's address for links
      HZC_SMTP_URL: ${HZC_SMTP_URL:-}
      HZC_MAIL_FROM: ${HZC_MAIL_FROM:-}
      HZC_PUBLIC_URL: ${HZC_PUBLIC_URL:-}
      # public / shared deployment: model endpoints and result links may not point into the private
      # network (set to 0 only if your models run on this host or LAN)
      HZC_BLOCK_PRIVATE_NETWORK: ${HZC_BLOCK_PRIVATE_NETWORK:-1}
      # your domain(s) behind a reverse proxy, comma-separated (e.g. canvas.example.com)
      HZC_ALLOWED_HOSTS: ${HZC_ALLOWED_HOSTS:-}
      # 1 when a reverse proxy in front terminates HTTPS / forwards the client address
      HZC_HSTS: ${HZC_HSTS:-0}
      HZC_TRUST_PROXY: ${HZC_TRUST_PROXY:-0}
    volumes:
      - hzc-data:/data
    restart: unless-stopped
    # time to finish requests and close the database cleanly on `docker compose down` / restart
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  hzc-data:
