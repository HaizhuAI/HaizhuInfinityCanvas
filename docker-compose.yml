services:
  haizhu-canvas:
    build: .
    image: haizhu-infinity-canvas:1.0.0-rc.9
    ports:
      - "8787:8787"
    environment:
      # required: access token for the WebUI API (enter it in 设置 → 访问口令)
      HZC_TOKEN: ${HZC_TOKEN:?set HZC_TOKEN in your environment or .env}
      # public / shared deployment: model endpoints and result links may not point into the private
      # network (set to 0 only if your models run on this host or LAN)
      HZC_BLOCK_PRIVATE_NETWORK: ${HZC_BLOCK_PRIVATE_NETWORK:-1}
      # your domain(s) behind a reverse proxy, comma-separated (e.g. canvas.example.com)
      HZC_ALLOWED_HOSTS: ${HZC_ALLOWED_HOSTS:-}
      # 1 when a reverse proxy in front terminates HTTPS / forwards the client address
      HZC_HSTS: ${HZC_HSTS:-0}
      HZC_TRUST_PROXY: ${HZC_TRUST_PROXY:-0}
    volumes:
      - hzc-data:/data
    restart: unless-stopped
    # time to finish requests and close the database cleanly on `docker compose down` / restart
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  hzc-data:
