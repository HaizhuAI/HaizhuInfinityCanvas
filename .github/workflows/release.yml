name: Build installers

# Runs on version tags, on dev-branch pushes that touch shipped code, or manually. Artifacts are attached to the run
# (no GitHub Release is created by this workflow).
on:
  push:
    tags: ["v*"]
    # test builds on the development branch whenever shipped code changes
    branches: ["claude/**"]
    paths:
      - "apps/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "Dockerfile"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flag: --win
            artifacts: |
              apps/desktop/release/*-setup.exe
              apps/desktop/release/*-portable.exe
          - os: ubuntu-latest
            flag: --linux
            artifacts: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/*.deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1" # electron-builder fetches its own Electron
      - run: pnpm build
      - name: Package desktop app
        run: pnpm --filter @hzc/desktop exec electron-builder ${{ matrix.flag }} --publish never
      # start the packaged app: it must launch its server, load the UI and seal the API-key master key
      - name: Launch test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb)
          export HZC_SMOKE=1 HZC_SMOKE_OUT="$RUNNER_TEMP/smoke.txt" XDG_CONFIG_HOME="$(mktemp -d)"
          timeout 120 xvfb-run -a apps/desktop/release/linux-unpacked/haizhu-infinity-canvas --no-sandbox || true
          cat "$HZC_SMOKE_OUT"
          grep -q 'window ready, brand="Haizhu Infinity Canvas' "$HZC_SMOKE_OUT"
      - name: Launch test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:HZC_SMOKE = '1'; $env:HZC_SMOKE_OUT = Join-Path $env:RUNNER_TEMP 'smoke.txt'
          $exe = Get-ChildItem apps/desktop/release/win-unpacked -Filter *.exe | Where-Object { $_.Name -notmatch 'uninstall|elevate' } | Select-Object -First 1
          Write-Host "starting $($exe.FullName)"
          $p = Start-Process -FilePath $exe.FullName -PassThru
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; Write-Host 'app did not quit within 120 s' }
          if (Test-Path $env:HZC_SMOKE_OUT) { Get-Content $env:HZC_SMOKE_OUT } else { throw 'no smoke output' }
          if (-not (Select-String -Path $env:HZC_SMOKE_OUT -Pattern 'window ready, brand="Haizhu Infinity Canvas' -Quiet)) { throw 'the app did not show its UI' }
      - name: Both Windows packages exist (installer and portable must not overwrite each other)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem apps/desktop/release -Filter *.exe | ForEach-Object { Write-Host "$($_.Name)  $([math]::Round($_.Length / 1MB, 1)) MB" }
          if (-not (Test-Path apps/desktop/release/*-setup.exe)) { throw 'NSIS installer missing' }
          if (-not (Test-Path apps/desktop/release/*-portable.exe)) { throw 'portable exe missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 30

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build WebUI image
        run: docker build -t haizhu-infinity-canvas:ci .
      - name: Smoke test image (non-loopback bind requires a token)
        run: |
          docker run -d --name hzc -e HZC_TOKEN=ci-token -p 8787:8787 haizhu-infinity-canvas:ci
          for i in $(seq 1 30); do curl -sf localhost:8787/api/health && break; sleep 1; done
          curl -sf localhost:8787/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8787/api/profiles)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'x-hzc-token: ci-token' localhost:8787/api/profiles)" = 200
          # without a token the container must refuse to start
          ! docker run --rm haizhu-infinity-canvas:ci
