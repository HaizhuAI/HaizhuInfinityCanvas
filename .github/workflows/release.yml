name: Build installers

# Runs on version tags, on dev-branch pushes that touch shipped code, or manually. Every run attaches the installers
# and the server package to the run. A version tag (v1.2.3, v1.0.0-rc.20) also publishes them: a GitHub Release
# (a pre-release when the version has a "-" suffix) with every file attached, and the Docker image on ghcr.io.
on:
  push:
    tags: ["v*"]
    # test builds on the development branch whenever shipped code changes
    branches: ["claude/**"]
    paths:
      - "apps/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "Dockerfile"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows on ARM runs the x64 build through Windows' own emulation
          - os: windows-latest
            name: windows-x64
            flag: --win
            artifacts: |
              apps/desktop/release/*-setup.exe
              apps/desktop/release/*-portable.exe
          - os: ubuntu-latest
            name: linux-x64-arm64
            flag: --linux --x64 --arm64
            artifacts: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/*.deb
          # Apple silicon runner: builds both Apple silicon and Intel; ad-hoc signed (not notarized)
          - os: macos-latest
            name: macos-arm64-x64
            flag: --mac --arm64 --x64
            artifacts: |
              apps/desktop/release/*.dmg
              apps/desktop/release/*-mac-*.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1" # electron-builder fetches its own Electron
      - run: pnpm build
      # electron-builder downloads Electron and its packaging tools (NSIS, winCodeSign, AppImage) from
      # GitHub releases. Keep them between builds — also after a failed build, so the downloads that did
      # succeed aren't fetched again — so a slow or failing download host doesn't fail the build.
      - id: dlcache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-dl-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-dl-${{ runner.os }}-
      - name: Package desktop app
        id: pack
        shell: bash
        run: |
          # those downloads sometimes time out (HTTP 504); finished downloads are kept between attempts
          for attempt in 1 2 3 4 5; do
            pnpm --filter @hzc/desktop exec electron-builder ${{ matrix.flag }} --publish never && exit 0
            [ "$attempt" = 5 ] && break
            echo "::warning::packaging attempt $attempt failed; retrying in $((attempt * 30)) s"
            sleep $((attempt * 30))
          done
          exit 1
      - name: Keep downloaded packaging tools
        if: always() && steps.dlcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          # a failed build saves what it got under a per-run key; restore-keys picks the newest
          key: electron-dl-${{ runner.os }}-${{ steps.pack.outcome == 'success' && hashFiles('pnpm-lock.yaml') || format('partial-{0}-{1}', github.run_id, github.run_attempt) }}
      # start the packaged app: it must launch its server, load the UI and seal the API-key master key
      - name: Launch test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb)
          export HZC_SMOKE=1 HZC_SMOKE_RESTART=1 HZC_SMOKE_OUT="$RUNNER_TEMP/smoke.txt" XDG_CONFIG_HOME="$(mktemp -d)"
          timeout 150 xvfb-run -a apps/desktop/release/linux-unpacked/haizhu-infinity-canvas --no-sandbox || true
          cat "$HZC_SMOKE_OUT"
          grep -q 'window ready, brand="Haizhu Infinity Canvas' "$HZC_SMOKE_OUT"
          # the server was killed on purpose: the app restarted it and showed its UI again
          grep -q 'after server restart, brand="Haizhu Infinity Canvas' "$HZC_SMOKE_OUT"
          # an MCP client (Claude Code) reaches the canvas through the bridge, run by the app's own executable
          grep -q 'mcp bridge ok' "$HZC_SMOKE_OUT"
      - name: Launch test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:HZC_SMOKE = '1'; $env:HZC_SMOKE_RESTART = '1'; $env:HZC_SMOKE_OUT = Join-Path $env:RUNNER_TEMP 'smoke.txt'
          $exe = Get-ChildItem apps/desktop/release/win-unpacked -Filter *.exe | Where-Object { $_.Name -notmatch 'uninstall|elevate' } | Select-Object -First 1
          Write-Host "starting $($exe.FullName)"
          $p = Start-Process -FilePath $exe.FullName -PassThru
          if (-not $p.WaitForExit(150000)) { Stop-Process -Id $p.Id -Force; Write-Host 'app did not quit within 120 s' }
          if (Test-Path $env:HZC_SMOKE_OUT) { Get-Content $env:HZC_SMOKE_OUT } else { throw 'no smoke output' }
          if (-not (Select-String -Path $env:HZC_SMOKE_OUT -Pattern 'window ready, brand="Haizhu Infinity Canvas' -Quiet)) { throw 'the app did not show its UI' }
          if (-not (Select-String -Path $env:HZC_SMOKE_OUT -Pattern 'after server restart, brand="Haizhu Infinity Canvas' -Quiet)) { throw 'the app did not recover from a server crash' }
          if (-not (Select-String -Path $env:HZC_SMOKE_OUT -Pattern 'mcp bridge ok' -Quiet)) { throw 'the MCP bridge did not answer' }
      - name: Launch test (macOS, Apple silicon build)
        if: runner.os == 'macOS'
        run: |
          APP="$(ls -d apps/desktop/release/mac-arm64/*.app | head -1)"
          codesign --verify --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E 'Signature|Identifier' || true
          BIN="$APP/Contents/MacOS/$(ls "$APP/Contents/MacOS" | head -1)"
          export HZC_SMOKE=1 HZC_SMOKE_RESTART=1 HZC_SMOKE_OUT="$RUNNER_TEMP/smoke.txt"
          # no `timeout` on macOS: perl's alarm ends a hung app
          perl -e 'alarm shift; exec @ARGV' 150 "$BIN" || true
          cat "$HZC_SMOKE_OUT"
          grep -q 'window ready, brand="Haizhu Infinity Canvas' "$HZC_SMOKE_OUT"
          grep -q 'after server restart, brand="Haizhu Infinity Canvas' "$HZC_SMOKE_OUT"
          grep -q 'mcp bridge ok' "$HZC_SMOKE_OUT"
          # the Intel build is there too
          ls -d apps/desktop/release/mac/*.app
      - name: List packages
        shell: bash
        run: ls -la apps/desktop/release | grep -Ei '\.(exe|appimage|deb|dmg|zip)$' || true
      - name: Both Windows packages exist (installer and portable must not overwrite each other)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem apps/desktop/release -Filter *.exe | ForEach-Object { Write-Host "$($_.Name)  $([math]::Round($_.Length / 1MB, 1)) MB" }
          if (-not (Test-Path apps/desktop/release/*-setup.exe)) { throw 'NSIS installer missing' }
          if (-not (Test-Path apps/desktop/release/*-portable.exe)) { throw 'portable exe missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 30

  # the WebUI without Docker: server bundle + web UI + start script, for Node.js 22.13+ on any server
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @hzc/core --filter @hzc/server --filter @hzc/web
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: pnpm --filter @hzc/core build && pnpm --filter @hzc/web build && pnpm --filter @hzc/server build
      - name: Package
        run: |
          VER=$(node -p "require('./package.json').version")
          D="haizhu-infinity-canvas-$VER-server"
          mkdir -p "pkg/$D"
          cp -r apps/server/dist "pkg/$D/server"
          cp -r apps/web/dist "pkg/$D/web"
          cp deploy/server/start.sh deploy/server/README.md LICENSE THIRD_PARTY_NOTICES.md "pkg/$D/"
          chmod +x "pkg/$D/start.sh"
          tar -C pkg -czf "$D.tar.gz" "$D"
          ls -la "$D.tar.gz"
      - name: Smoke test the package (unpacked elsewhere, nothing else installed)
        run: |
          T=$(mktemp -d) && tar -C "$T" -xzf haizhu-infinity-canvas-*-server.tar.gz
          cd "$T"/haizhu-infinity-canvas-*-server
          PORT=8795 ./start.sh > "$T/log.txt" 2>&1 &
          PID=$!
          for i in $(seq 1 30); do curl -sf localhost:8795/api/health >/dev/null && break; sleep 1; done
          curl -sf localhost:8795/api/health
          curl -sf localhost:8795/ | grep -qi '<div id="root"'
          test -d data
          kill $PID
          # beyond localhost it refuses to start without an access token (exits by itself, not by the timeout)
          set +e; HZC_HOST=0.0.0.0 PORT=8796 timeout 20 ./start.sh; rc=$?; set -e
          echo "exit code without a token: $rc"
          test "$rc" != 0 && test "$rc" != 124
      - uses: actions/upload-artifact@v4
        with:
          name: server-node
          path: haizhu-infinity-canvas-*-server.tar.gz
          if-no-files-found: error
          retention-days: 30

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # version tags push the image to ghcr.io
    steps:
      - uses: actions/checkout@v4
      - name: Build WebUI image
        run: docker build -t haizhu-infinity-canvas:ci .
      - name: Smoke test image (non-loopback bind requires a token)
        run: |
          # run hardened the way docker-compose.yml does: read-only root, no capabilities, no privilege gain
          docker run -d --name hzc --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            -v hzc-ci-data:/data -e HZC_TOKEN=ci-token-0123456789abcdef -e HZC_BLOCK_PRIVATE_NETWORK=1 -p 8787:8787 haizhu-infinity-canvas:ci
          for i in $(seq 1 30); do curl -sf localhost:8787/api/health && break; sleep 1; done
          curl -sf localhost:8787/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8787/api/profiles)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'x-hzc-token: wrong' localhost:8787/api/profiles)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'x-hzc-token: ci-token-0123456789abcdef' localhost:8787/api/profiles)" = 200
          # security headers on the page; requests from another site are refused even with the token
          curl -sI localhost:8787/ | tee /tmp/headers.txt
          grep -qi '^content-security-policy:' /tmp/headers.txt
          grep -qi '^x-frame-options: DENY' /tmp/headers.txt
          grep -qi '^x-content-type-options: nosniff' /tmp/headers.txt
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'x-hzc-token: ci-token-0123456789abcdef' -H 'origin: https://evil.example' -H 'content-type: application/json' -d '{}' localhost:8787/api/projects)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'x-hzc-token: ci-token-0123456789abcdef' -H 'content-type: application/json' -d '{"name":"ci"}' localhost:8787/api/projects)" = 201
          # redundancy: a startup backup exists, a manual one works, and `docker stop` shuts down cleanly
          curl -sf -X POST -H 'x-hzc-token: ci-token-0123456789abcdef' localhost:8787/api/backups
          test "$(curl -s -H 'x-hzc-token: ci-token-0123456789abcdef' localhost:8787/api/backups | grep -o '"name"' | wc -l)" -ge 2
          docker stop -t 20 hzc
          docker logs hzc 2>&1 | tail -5
          docker logs hzc 2>&1 | grep -q 'shutting down (SIGTERM)'
          test "$(docker inspect -f '{{.State.ExitCode}}' hzc)" = 0
          # the data survives a restart
          docker start hzc
          for i in $(seq 1 30); do curl -sf localhost:8787/api/health >/dev/null && break; sleep 1; done
          curl -s -H 'x-hzc-token: ci-token-0123456789abcdef' localhost:8787/api/projects | grep -q '"name":"ci"'
          docker rm -f hzc
      - name: MCP over HTTP in the image (agent key from the settings API)
        run: |
          docker run -d --name mcp -e HZC_TOKEN=ci-token-0123456789abcdef -p 8790:8787 haizhu-infinity-canvas:ci
          for i in $(seq 1 30); do curl -sf localhost:8790/api/health >/dev/null && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"ping"}' localhost:8790/mcp)" = 401
          KEY=$(curl -sf -X POST -H 'x-hzc-token: ci-token-0123456789abcdef' -H 'content-type: application/json' -d '{"action":"enable"}' localhost:8790/api/agent-access | sed -E 's/.*"token":"([^"]+)".*/\1/')
          curl -sf -X POST -H "authorization: Bearer $KEY" -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"create_project","arguments":{"name":"from-agent"}}}' localhost:8790/mcp | grep -q 'project_id'
          curl -sf -H 'x-hzc-token: ci-token-0123456789abcdef' localhost:8790/api/projects | grep -q 'from-agent'
          docker rm -f mcp
      - name: Build and start the arm64 image (QEMU)
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          docker buildx create --use --name multi >/dev/null
          docker buildx build --platform linux/arm64 -t haizhu-infinity-canvas:arm64 --load .
          docker run -d --name arm --platform linux/arm64 -e HZC_TOKEN=ci-token-0123456789abcdef -p 8791:8787 haizhu-infinity-canvas:arm64
          for i in $(seq 1 90); do curl -sf localhost:8791/api/health >/dev/null && break; sleep 1; done
          curl -sf localhost:8791/api/health
          docker exec arm node -p 'process.arch' | grep -q arm64
          docker rm -f arm
      - name: Smoke test image in accounts mode (multi-user website)
        run: |
          # without HZC_ALLOWED_HOSTS a public accounts deployment must refuse to start (`! cmd` never fails a step)
          set +e; timeout 60 docker run --rm -e HZC_ACCOUNTS=1 haizhu-infinity-canvas:ci; rc=$?; set -e
          test "$rc" != 0 && test "$rc" != 124
          docker run -d --name saas --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            -v hzc-saas-data:/data -e HZC_ACCOUNTS=1 -e HZC_ALLOWED_HOSTS=localhost -p 8788:8787 haizhu-infinity-canvas:ci
          for i in $(seq 1 30); do curl -sf localhost:8788/api/health >/dev/null && break; sleep 1; done
          curl -sf localhost:8788/api/health | grep -q '"accounts":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8788/api/projects)" = 401
          J='content-type: application/json'; O='origin: http://localhost:8788'
          # two accounts; each sees only its own canvas
          curl -sf -c ann.txt -H "$J" -H "$O" -d '{"email":"ann@example.com","password":"teal-lantern-42"}' localhost:8788/api/auth/signup
          grep -q 'hzc_session' ann.txt
          curl -sf -b ann.txt -H "$J" -H "$O" -d '{"name":"ann-canvas"}' localhost:8788/api/projects
          curl -sf -c bob.txt -H "$J" -H "$O" -d '{"email":"bob@example.com","password":"bob-lantern-77"}' localhost:8788/api/auth/signup
          if curl -sf -b bob.txt localhost:8788/api/projects | grep -q 'ann-canvas'; then echo "bob sees ann's canvas"; exit 1; fi
          curl -sf -b ann.txt localhost:8788/api/projects | grep -q 'ann-canvas'
          # the admin console answers admins only
          test "$(curl -s -o /dev/null -w '%{http_code}' -b ann.txt localhost:8788/api/admin/overview)" = 403
          # cross-site sign-in refused; operator command lists both accounts
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$J" -H 'origin: https://evil.example' -d '{"email":"ann@example.com","password":"teal-lantern-42"}' localhost:8788/api/auth/login)" = 403
          docker exec saas node server/index.mjs admin users | tee users.txt
          grep -q '共 2 个账号' users.txt
          docker stop -t 20 saas
          test "$(docker inspect -f '{{.State.ExitCode}}' saas)" = 0
          # without a token, or with a weak / example one, the container must refuse to start
          for args in "" "-e HZC_TOKEN=short" "-e HZC_TOKEN=change-me-to-a-long-random-string"; do
            set +e; timeout 60 docker run --rm $args haizhu-infinity-canvas:ci; rc=$?; set -e
            echo "docker run $args -> exit $rc"
            test "$rc" != 0 && test "$rc" != 124
          done
      - name: FFmpeg's licence files travel with the image
        run: |
          docker run --rm --entrypoint sh haizhu-infinity-canvas:ci -c 'test -s /usr/share/doc/ffmpeg/copyright && test -s /app/THIRD_PARTY_NOTICES.md && ffmpeg -hide_banner -version | head -1'
      - name: Publish the image (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/$OWNER/haizhu-infinity-canvas"
          VER="${GITHUB_REF_NAME#v}"
          # a pre-release moves the "rc" tag; a final release moves "latest"
          case "$VER" in *-*) CHANNEL=rc ;; *) CHANNEL=latest ;; esac
          docker buildx use multi
          docker buildx build --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.version=$VER" \
            -t "$IMAGE:$VER" -t "$IMAGE:$CHANNEL" --push .
          echo "published $IMAGE:$VER and $IMAGE:$CHANNEL"

  # a version tag: a GitHub Release with every installer and the server package attached
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, server, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist && ls -la && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes (zh + en, from the changelogs)
        run: node .github/release-notes.mjs "${GITHUB_REF_NAME#v}" > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$GITHUB_REF_NAME" in *-*) PRE=--prerelease ;; *) PRE=--latest ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag $PRE \
            --title "Haizhu Infinity Canvas ${GITHUB_REF_NAME}" --notes-file notes.md
